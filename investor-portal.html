<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Investor Portal — EquitiFy Capital</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<script>
  /* ===== SET THE INVESTOR PORTAL URL HERE =====
     Paste the full link to the external portal (e.g. "https://investors.example.com").
     While it is empty, the page shows a "coming soon" message instead of redirecting. */
  var PORTAL_URL = "";
  var REDIRECT_DELAY_MS = 1500;
</script>
<script src="site.js" defer></script>
<style>
  :root{
    --navy:#1B2A3B;--navy-deep:#141F2C;--accent-deep:#2A93E6;--accent-on-dark:#6FC5FF;--radius:4px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Libre Franklin',sans-serif;background:var(--navy-deep);color:#fff;}
  a{color:inherit;text-decoration:none;}

  .portal{min-height:100vh;display:flex;align-items:center;position:relative;overflow:hidden;}
  .portal::before{content:"";position:absolute;inset:0;background:url("public/mountain_8.jpg") center/cover no-repeat;}
  .portal::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg, rgba(20,31,44,.85) 0%, rgba(20,31,44,.7) 100%);}
  .portal-inner{position:relative;z-index:1;max-width:1140px;width:100%;margin:0 auto;padding:140px 40px 100px;}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-on-dark);margin-bottom:16px;}
  h1{font-weight:400;font-size:3.2em;line-height:1.16;letter-spacing:-0.015em;margin-bottom:20px;}
  .sub{font-size:16px;line-height:1.75;color:#C7D0DA;max-width:620px;margin-bottom:34px;}
  .btn{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;padding:14px 28px;border-radius:var(--radius);border:1px solid var(--accent-deep);background:var(--accent-deep);color:#fff;transition:background .15s ease;}
  .btn:hover{background:#1F7FCB;border-color:#1F7FCB;}
  .note{font-size:13px;color:#AEB9C6;margin-top:18px;}
  .note a{text-decoration:underline;}
  @media (max-width:900px){ h1{font-size:2.1em;} .portal-inner{padding:120px 20px 80px;} }
</style>
</head>
<body>

<site-header base="" active="investor" overlay></site-header>

<section class="portal">
  <div class="portal-inner">
    <div class="eyebrow">Investor Portal</div>
    <h1 id="portalTitle">Taking you to the investor portal…</h1>
    <p class="sub" id="portalSub">You are being redirected to our secure investor portal to view your statements, documents, and distributions.</p>
    <a class="btn" id="portalBtn" href="index.html#contact">Go to Investor Portal</a>
    <p class="note" id="portalNote">Not redirected? Use the button above.</p>
  </div>
</section>

<site-footer base=""></site-footer>

<script>
  (function(){
    var btn = document.getElementById("portalBtn");
    if(PORTAL_URL){
      btn.href = PORTAL_URL;
      setTimeout(function(){ window.location.replace(PORTAL_URL); }, REDIRECT_DELAY_MS);
    } else {
      document.getElementById("portalTitle").textContent = "Investor portal coming soon.";
      document.getElementById("portalSub").textContent = "Our secure investor portal is being set up. Existing investors can reach our team directly for statements and documents in the meantime.";
      btn.textContent = "Contact Investor Relations";
      document.getElementById("portalNote").innerHTML = 'Or email <a href="mailto:admin@equitifycapital.net">admin@equitifycapital.net</a>';
    }
  })();
</script>
</body>
</html>
